name: ml-ci-cd

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure isolated MLflow database
        # Runner variables are available inside steps, not job-level env.
        run: echo "MLFLOW_TRACKING_URI=sqlite:///$RUNNER_TEMP/mlflow-ci.db" >> "$GITHUB_ENV"

      - name: Prepare CI training data
        # train.csv is DVC-managed, with no remote configured yet.
        # Use the Git-tracked dataset explicitly selected for CI.
        run: cp data/train_v2.csv data/train.csv

      - name: Validate training data
        run: python scripts/validate_data.py

      - name: Train model
        run: python scripts/train.py 200 8

      - name: Check actual training AUC
        run: |
          python - <<'PY'
          import math
          import os
          import runpy
          import subprocess
          import sys
          from mlflow.tracking import MlflowClient

          client = MlflowClient()
          experiment = client.get_experiment_by_name("training-siang")
          if experiment is None:
              raise RuntimeError("Training experiment not found")
          runs = client.search_runs(
              [experiment.experiment_id],
              filter_string="attributes.status = 'FINISHED'",
              order_by=["attributes.start_time DESC"],
              max_results=1,
          )
          if not runs or "auc" not in runs[0].data.metrics:
              raise RuntimeError("No completed training run with an AUC metric")
          auc = runs[0].data.metrics["auc"]
          if not math.isfinite(auc):
              raise RuntimeError(f"Invalid AUC: {auc}")
          minimum_auc = runpy.run_path("scripts/check_model_gate.py")["MINIMUM_AUC"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Training AUC: **{auc:.6f}**; required: **{minimum_auc}**\n")
          subprocess.run(
              [sys.executable, "scripts/check_model_gate.py", str(auc)],
              check=True,
          )
          PY

  test-app:
    # Test the packaged model independently of the new training run's gate.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t mlops-training-model:ci .

      - name: Start API container
        run: docker run -d --name mlops-api-ci -p 127.0.0.1:8080:8080 mlops-training-model:ci

      - name: Test health and prediction endpoints
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request

          base_url = "http://127.0.0.1:8080"
          for attempt in range(30):
              running = subprocess.check_output(
                  ["docker", "inspect", "--format", "{{.State.Running}}", "mlops-api-ci"],
                  text=True,
              ).strip()
              if running != "true":
                  raise RuntimeError("API container stopped; see the container logs step")
              try:
                  with urllib.request.urlopen(f"{base_url}/health", timeout=2) as response:
                      health = json.load(response)
                  assert health == {"status": "ok"}, health
                  break
              except (urllib.error.URLError, TimeoutError, ConnectionError) as error:
                  print(f"API not ready ({attempt + 1}/30): {error}", flush=True)
                  if attempt == 29:
                      raise RuntimeError("API did not become ready; see container logs") from error
                  time.sleep(2)

          request = urllib.request.Request(
              f"{base_url}/predict",
              data=json.dumps({"age": 35, "income": 8000000}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              result = json.load(response)
          assert result["prediction"] in (0, 1), result
          assert 0 <= result["probability"] <= 1, result
          print("API smoke test passed:", result)
          PY

      - name: Show container logs
        if: always()
        run: docker logs mlops-api-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f mlops-api-ci || true
